name: Build and deploy website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hoststar-deploy
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - name: Cache source downloads
        uses: actions/cache@v4
        with:
          path: pipeline/cache
          key: pipeline-${{ runner.os }}-${{ hashFiles('pipeline/config.py', 'pipeline/download.py') }}

      - name: Install pipeline dependencies
        run: python -m pip install -r pipeline/requirements.txt

      - name: Generate datasets
        run: python -m pipeline.run_all

      - name: Vendor Three.js
        run: python scripts/vendor_three.py

      - name: Run pipeline tests
        run: python -m pytest -q

      - name: Assemble static website
        run: |
          mkdir -p _site
          cp index.html _site/
          cp -R css js public _site/
          # Cache-Busting: Einstiegsdateien pro Commit versionieren, damit neue Versionen sofort sichtbar sind
          v="${GITHUB_SHA::8}"
          sed -i "s#href=\"css/main.css\"#href=\"css/main.css?v=$v\"#; s#src=\"js/main.js\"#src=\"js/main.js?v=$v\"#" _site/index.html
          grep -q "main.css?v=$v" _site/index.html && grep -q "main.js?v=$v" _site/index.html

      - name: Upload website artifact
        uses: actions/upload-artifact@v4
        with:
          name: hoststar-site
          path: _site/
          if-no-files-found: error
          retention-days: 3

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site/

  deploy-pages:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  deploy:
    if: ${{ vars.HOSTSTAR_SFTP_ENABLED == 'true' }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download website artifact
        uses: actions/download-artifact@v4
        with:
          name: hoststar-site
          path: _site

      - name: Deploy to Hoststar with explicit FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.HOSTSTAR_SFTP_SERVER }}
          username: ${{ secrets.HOSTSTAR_SFTP_USERNAME }}
          password: ${{ secrets.HOSTSTAR_SFTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: _site/
          server-dir: ./
          security: strict
          dangerous-clean-slate: false
