name: Build and deploy website

on:
  push:
    branches: [main]
  # Monatlich neu bauen, damit veränderliche Quelldaten (GWR, PV-Register, OSM, Grundstücke, Abstimmungen)
  # ohne Code-Änderung aktuell bleiben. 1. des Monats, 03:17 UTC.
  schedule:
    - cron: "17 3 1 * *"
  workflow_dispatch:
    inputs:
      refresh:
        description: "Veränderliche Quelldaten jetzt neu laden (GWR, PV, OSM, Grundstücke, Abstimmungen)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: hoststar-deploy
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      # Zwei Zwischenspeicher: Grosse, selten neue Daten (Gelände, Gebäude, Luftbild, Vegetation) bleiben gespeichert.
      # Veränderliche Daten werden einmal pro Monat frisch geladen (Monat im Schlüssel) oder sofort per manuellem
      # Lauf mit «refresh». Vorher hielt ein einziger Speicher alle Downloads unbegrenzt fest.
      - name: Determine cache keys
        id: keys
        run: |
          echo "month=$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.refresh }}" = "true" ]; then
            echo "fresh=-run${{ github.run_id }}" >> "$GITHUB_OUTPUT"
          else
            echo "fresh=" >> "$GITHUB_OUTPUT"
          fi

      - name: Cache static source downloads
        uses: actions/cache@v4
        with:
          path: |
            pipeline/cache/terrain
            pipeline/cache/buildings
            pipeline/cache/ortho
            pipeline/cache/ortho_hires
            pipeline/cache/vegetation
            pipeline/cache/stac
            pipeline/cache/boundary_raw.json
          key: pipeline-static-${{ runner.os }}-${{ hashFiles('pipeline/config.py', 'pipeline/download.py') }}

      - name: Cache changing source downloads (monthly)
        uses: actions/cache@v4
        with:
          path: |
            pipeline/cache/gwr
            pipeline/cache/pv
            pipeline/cache/osm
            pipeline/cache/parcels
            pipeline/cache/votes
          key: pipeline-changing-${{ runner.os }}-${{ steps.keys.outputs.month }}${{ steps.keys.outputs.fresh }}-${{ hashFiles('pipeline/config.py', 'pipeline/download.py') }}

      - name: Install pipeline dependencies
        run: python -m pip install -r pipeline/requirements.txt

      - name: Generate datasets
        run: python -m pipeline.run_all

      - name: Vendor Three.js
        run: python scripts/vendor_three.py

      - name: Run pipeline tests
        run: python -m pytest -q

      - name: Assemble static website
        run: |
          mkdir -p _site
          cp index.html _site/
          cp -R css js public intro _site/
          # Cache-Busting: Einstiegsdateien pro Commit versionieren, damit neue Versionen sofort sichtbar sind
          v="${GITHUB_SHA::8}"
          sed -i "s#href=\"css/main.css\"#href=\"css/main.css?v=$v\"#; s#src=\"js/main.js\"#src=\"js/main.js?v=$v\"#" _site/index.html
          grep -q "main.css?v=$v" _site/index.html && grep -q "main.js?v=$v" _site/index.html
          # Auch alle relativen Modul-Importe versionieren: Sonst kombiniert der Browser ein neues main.js mit
          # bis zu 10 Minuten alten Modulen aus dem Cache (GitHub Pages: max-age=600), und der Start schlägt fehl.
          sed -i -E "s#(from[[:space:]]*\")(\./[^\"?]+\.js)\"#\1\2?v=$v\"#g" _site/js/*.js
          ! grep -nE "from[[:space:]]*\"\./[^\"?]+\.js\"" _site/js/*.js
          grep -q "from \"./scene.js?v=$v\"" _site/js/main.js

      - name: Upload website artifact
        uses: actions/upload-artifact@v4
        with:
          name: hoststar-site
          path: _site/
          if-no-files-found: error
          retention-days: 3

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site/

  deploy-pages:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  deploy:
    if: ${{ vars.HOSTSTAR_SFTP_ENABLED == 'true' }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download website artifact
        uses: actions/download-artifact@v4
        with:
          name: hoststar-site
          path: _site

      - name: Deploy to Hoststar with explicit FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.HOSTSTAR_SFTP_SERVER }}
          username: ${{ secrets.HOSTSTAR_SFTP_USERNAME }}
          password: ${{ secrets.HOSTSTAR_SFTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: _site/
          server-dir: ./
          security: strict
          dangerous-clean-slate: false
