name: Build and deploy to Hoststar

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hoststar-deploy
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - name: Cache source downloads
        uses: actions/cache@v4
        with:
          path: pipeline/cache
          key: pipeline-${{ runner.os }}-${{ hashFiles('pipeline/config.py') }}
          restore-keys: |
            pipeline-${{ runner.os }}-

      - name: Install pipeline dependencies
        run: python -m pip install -r pipeline/requirements.txt

      - name: Generate datasets
        run: python -m pipeline.run_all

      - name: Vendor Three.js
        run: python scripts/vendor_three.py

      - name: Run pipeline tests
        run: python -m pytest -q

      - name: Assemble static website
        run: |
          mkdir -p _site
          cp index.html _site/
          cp -R css js public _site/

      - name: Upload website artifact
        uses: actions/upload-artifact@v4
        with:
          name: hoststar-site
          path: _site/
          if-no-files-found: error
          retention-days: 3

  deploy:
    if: ${{ vars.HOSTSTAR_SFTP_ENABLED == 'true' }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Check out source and pinned Hoststar key
        uses: actions/checkout@v4

      - name: Download website artifact
        uses: actions/download-artifact@v4
        with:
          name: hoststar-site
          path: _site

      - name: Install sshpass
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y sshpass

      - name: Deploy to Hoststar with verified SFTP
        env:
          HOSTSTAR_SFTP_SERVER: ${{ secrets.HOSTSTAR_SFTP_SERVER }}
          HOSTSTAR_SFTP_USERNAME: ${{ secrets.HOSTSTAR_SFTP_USERNAME }}
          SSHPASS: ${{ secrets.HOSTSTAR_SFTP_PASSWORD }}
        run: |
          printf 'put -r _site/* .\n' > "$RUNNER_TEMP/hoststar-sftp.batch"
          sshpass -e sftp \
            -P 5544 \
            -oHostKeyAlgorithms=+ssh-rsa \
            -oUserKnownHostsFile="$GITHUB_WORKSPACE/.github/hoststar_known_hosts" \
            -oStrictHostKeyChecking=yes \
            -b "$RUNNER_TEMP/hoststar-sftp.batch" \
            "$HOSTSTAR_SFTP_USERNAME@$HOSTSTAR_SFTP_SERVER"
