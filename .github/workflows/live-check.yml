name: Live-Prüfung

# Prüft die veröffentlichte Seite: Startet die App in Chrome, Firefox und Safari (WebKit)?
# Sind die Daten vollständig und aktuell? Antworten die Live-Schnittstellen?
# Schlägt eine Prüfung fehl, schickt GitHub automatisch ein Mail.
on:
  workflow_run:
    workflows: ["Build and deploy website"]
    types: [completed]
    branches: [main]
  schedule:
    - cron: "23 5 * * 1"  # jeden Montag, 06:23 Schweizer Winterzeit
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: live-check
  cancel-in-progress: true

env:
  SITE_URL: https://brunnen.multikanal.ch/

jobs:
  data:
    name: Daten und Schnittstellen
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Kurz warten, bis die neue Version ausgeliefert wird
        if: ${{ github.event_name == 'workflow_run' }}
        run: sleep 90
      - name: Daten und Schnittstellen prüfen
        run: python scripts/live_check.py "$SITE_URL" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Bericht sichern
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-check-data
          path: live-check/
          retention-days: 30

  browser:
    name: Start im Browser (${{ matrix.browser }})
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    # Ubuntu 24.04 fest: Unter ubuntu-latest (seit Okt. 2026 Ubuntu 26) lassen sich die WebKit-Abhängigkeiten
    # dieser Playwright-Version nicht installieren.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Playwright installieren
        run: |
          npm install --no-save --no-package-lock playwright@1.48.2
          npx playwright install --with-deps ${{ matrix.browser }}
      - name: Kurz warten, bis die neue Version ausgeliefert wird
        if: ${{ github.event_name == 'workflow_run' }}
        run: sleep 90
      - name: App starten
        run: |
          if [ "${{ matrix.browser }}" = firefox ]; then
            HEADED=1 xvfb-run -a node scripts/live_smoke.mjs "$SITE_URL" firefox | tee smoke.txt
          else
            node scripts/live_smoke.mjs "$SITE_URL" ${{ matrix.browser }} | tee smoke.txt
          fi
          status=${PIPESTATUS[0]}
          { echo "## Start in ${{ matrix.browser }}"; echo '```'; cat smoke.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit $status
      - name: Bericht und Screenshot sichern
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-check-${{ matrix.browser }}
          path: live-check/
          retention-days: 30
